name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulso
          POSTGRES_PASSWORD: pulso_ci
          POSTGRES_DB: pulso
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulso -d pulso"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pulso:pulso_ci@localhost:5432/pulso
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run db:verify
      - run: npm run build
