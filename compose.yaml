services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso_local
      POSTGRES_DB: pulso
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pulso_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso -d pulso"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pulso_data:
